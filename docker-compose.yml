version: "3.8"

services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: codealpha-chatbot:latest
    container_name: codealpha_cloud_chatbot
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - SECRET_KEY=codealpha-production-secret-key-2026
      # Optional: set for Generative AI fallback mode
      # - GEMINI_API_KEY=your_gemini_api_key_here
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
