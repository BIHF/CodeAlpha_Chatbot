<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot - CodeAlpha Chatbot Project</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <div class="header-left">
        <svg class="chat-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="header-title">Chatbot</span>
      </div>
      <div class="header-right">
        <span class="status-indicator"></span>
        <span class="status-text">Online</span>
      </div>
    </div>
  </header>

  <!-- Main Chat Container -->
  <main class="main-container">
    <div class="chat-card">
      <div id="chat-messages" class="chat-messages" aria-live="polite">
        <!-- Initial Welcome Message -->
        <div class="message bot">
          <div class="bubble">Hello! How can I help you today?</div>
        </div>
      </div>

      <!-- Message Input Form -->
      <form id="chat-form" class="chat-input-area">
        <input
          type="text"
          id="user-input"
          class="chat-input"
          placeholder="Type your message..."
          autocomplete="off"
          required
        />
        <button type="submit" id="send-button" class="send-btn">Send</button>
      </form>
    </div>

    <!-- Footer -->
    <footer class="footer">
      CodeAlpha Chatbot Project
    </footer>
  </main>

  <script src="/static/js/main.js"></script>
</body>
</html>
